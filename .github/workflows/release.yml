name: Sign and publish package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        required: true
        type: choice
        options: [dice3d, translator]
      ref:
        description: Source commit SHA, tag or branch (resolved before approval)
        required: true
        default: main
        type: string

permissions:
  contents: read
concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.package == 'dice3d' && 'Gravewright/Gravewright-3D-Dice' || 'Gravewright/translator' }}
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
      - id: source
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install 'cryptography==50.0.2' 'Django==5.2.18'
      - if: inputs.package == 'dice3d'
        working-directory: source
        run: |
          npm ci
          npm test
          npm run build
      - if: inputs.package == 'translator'
        working-directory: source
        run: |
          python -m unittest discover -s tests -p test_build.py
          python -c "from django.conf import settings; settings.configure(INSTALLED_APPS=['gravewright_translator'], SECRET_KEY='release-build'); import django; django.setup(); from django.core.management import call_command; call_command('build_translator', output='dist')"
      - run: |
          mkdir release
          cp source/dist/*.zip release/
          python scripts/release.py inspect --package "$PACKAGE" --source-sha "$SOURCE_SHA"
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: unsigned-package
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install 'cryptography==50.0.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - name: Sign approved artifact
        run: python scripts/release.py sign --package "$PACKAGE" --source-sha "$SOURCE_SHA"
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_ID: ${{ vars.SIGNING_KEY_ID }}
      - name: Publish release and catalog
        run: python scripts/release.py publish --package "$PACKAGE" --source-sha "$SOURCE_SHA"
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
